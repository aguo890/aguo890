<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t d"><title id="t">Fabrik</title><desc id="d">Fabrik (private, in production): ERP/MES for two apparel manufacturers, co-built with one other engineer; 100 pages and 5,300+ tests.</desc><style>@font-face{font-family:"ag-i4";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}.i4{font-family:"ag-i4",Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:400}@font-face{font-family:"ag-i6";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}.i6{font-family:"ag-i6",Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:600}@font-face{font-family:"ag-m4";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}.m4{font-family:"ag-m4",'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}@font-face{font-family:"ag-m7";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}.m7{font-family:"ag-m7",'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:.2}}.flow{stroke-dasharray:5 7;animation:flow .9s linear infinite}@keyframes flow{to{stroke-dashoffset:-12}}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 8s cubic-bezier(.3,0,.2,1) infinite backwards}@keyframes grow{0%{transform:scaleY(.04)}10%,90%{transform:scaleY(1)}100%{transform:scaleY(.04)}}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><defs><filter id="glow3" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="1" y="1" width="598" height="338" rx="6" fill="#C9D1D9" fill-opacity="0.042" stroke="#8B949E" stroke-opacity="0.32"/><path d="M1 13V1H13 M587 1H599V13 M599 327V339H587 M13 339H1V327" fill="none" stroke="#8B949E" stroke-width="1.6" stroke-opacity=".7"/><circle class="pulse" cx="30" cy="31" r="5" fill="#3FB950" filter="url(#glow3)"/><text x="44" y="37" class="m7" font-size="16" fill="#8B949E" letter-spacing="1">P-04</text><rect x="320.2" y="17" width="255.8" height="27" rx="4" fill="#C9D1D9" fill-opacity="0.07" stroke="#8B949E" stroke-opacity="0.32"/><text x="448.1" y="36" class="m4" font-size="16" fill="#8B949E" text-anchor="middle" letter-spacing="0.5">private · in production</text><text x="24" y="92" class="i6" font-size="30" fill="#E6EDF3" letter-spacing="-0.3">Fabrik</text><text x="24" y="123" class="i4" font-size="18" fill="#8B949E">ERP/MES for two apparel manufacturers: buyer orders → BOMs</text><text x="24" y="146" class="i4" font-size="18" fill="#8B949E">→ work orders → inventory → hourly line output.</text><path d="M24 300H576" stroke="#8B949E" stroke-opacity="0.32"/><text x="24" y="325" class="m4" font-size="16" fill="#8B949E">Next.js · TypeScript · Prisma · PostgreSQL · three.js</text><text x="24" y="176" class="m4" font-size="15" fill="#8B949E" letter-spacing="0.5">HOURLY OUTPUT vs TARGET</text><rect class="bar" x="32" y="214" width="22" height="72" rx="2" fill="#8B949E" fill-opacity=".55" style="animation-delay:0.00s"/><rect class="bar" x="65" y="210.4" width="22" height="75.6" rx="2" fill="#8B949E" fill-opacity=".55" style="animation-delay:0.12s"/><rect class="bar" x="98" y="206.8" width="22" height="79.2" rx="2" fill="#8B949E" fill-opacity=".55" style="animation-delay:0.24s"/><rect class="bar" x="131" y="212.2" width="22" height="73.8" rx="2" fill="#8B949E" fill-opacity=".55" style="animation-delay:0.36s"/><rect class="bar" x="164" y="205" width="22" height="81" rx="2" fill="#8B949E" fill-opacity=".55" style="animation-delay:0.48s"/><rect class="bar" x="197" y="232" width="22" height="54" rx="2" fill="#FFB627" fil