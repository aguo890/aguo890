<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t d"><title id="t">Job Automation Suite</title><desc id="d">Job Automation Suite (public repo): scrapes job boards, ranks roles, and generates tailored LaTeX résumés.</desc><style>@font-face{font-family:"ag-i4";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}.i4{font-family:"ag-i4",Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:400}@font-face{font-family:"ag-i6";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}.i6{font-family:"ag-i6",Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:600}@font-face{font-family:"ag-m4";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}.m4{font-family:"ag-m4",'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}@font-face{font-family:"ag-m7";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}.m7{font-family:"ag-m7",'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:.2}}.flow{stroke-dasharray:5 7;animation:flow .9s linear infinite}@keyframes flow{to{stroke-dashoffset:-12}}.rbar{transform-box:fill-box;transform-origin:0 50%;animation:rbar 6s cubic-bezier(.3,0,.2,1) infinite backwards}@keyframes rbar{0%{transform:scaleX(.05)}14%,88%{transform:scaleX(1)}100%{transform:scaleX(.05)}}.pline{transform-box:fill-box;transform-origin:0 50%;animation:pline 6s steps(12) infinite backwards}@keyframes pline{0%{transform:scaleX(0)}20%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><defs><filter id="glow3" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="1" y="1" width="598" height="338" rx="6" fill="#C9D1D9" fill-opacity="0.042" stroke="#8B949E" stroke-opacity="0.32"/><path d="M1 13V1H13 M587 1H599V13 M599 327V339H587 M13 339H1V327" fill="none" stroke="#8B949E" stroke-width="1.6" stroke-opacity=".7"/><circle class="pulse" cx="30" cy="31" r="5" fill="#4CC9F0" filter="url(#glow3)"/><text x="44" y="37" class="m7" font-size="16" fill="#8B949E" letter-spacing="1">P-05</text><rect x="441.4" y="17" width="134.6" height="27" rx="4" fill="#C9D1D9" fill-opacity="0.07" stroke="#8B949E" stroke-opacity="0.32"/><text x="508.7" y="36" class="m4" font-size="16" fill="#8B949E" text-anchor="middle" letter-spacing="0.5">public repo</text><text x="24" y="92" class="i6" font-size="30" fill="#E6EDF3" letter-spacing="-0.3">Job Automation Suite</text><text x="24" y="123" class="i4" font-size="18" fill="#8B949E">Scrapes Greenhouse, Lever, and Ashby boards, ranks roles with</text><text x="24" y="146" class="i4" font-size="18" fill="#8B949E">a custom scoring algorithm, and builds tailored LaTeX résumés.</text><path d="M24 300H576" stroke="#8B949E" stroke-opacity="0.32"/><text x="24" y="325" class="m4" font-size="16" fill="#8B949E">Python · Streamlit · GitHub Actions · LaTeX</text><text x="576" y="325" class="m7" font-size="16" fill="#4CC9F0" text-anchor="end">↗ view repo</text><text x="24" y="176" class="m7" font-size="15" fill="#8B949E" letter-spacing="1">01 SCRAPE</text><text x="220" y="176" class="m7" font-size="15" fill="#8B949E" letter-spacing="1">02 RANK</text><text x="428" y="176" class="m7" font-size="15" fill="#8B949E" letter-spacing="1">03 PDF</text><rect x="24" y="190" width="138" height="26" rx="4" fill="#C9D1D9" fill-opacity="0.0875" stroke="#8B949E" stroke-opacity="0.32"/><text x="36" y="208" class="m4" font-size="15" fill="#E6EDF3">Greenhouse</text><rect x="24" y="222" width="138" height="26" rx="4" fill="#C9D1D