eight="4" rx="2" fill="#8B949E" style="animation-delay:1.70s"/><rect class="pline" x="438" y="245" width="39.9" height="4" rx="2" fill="#8B949E" style="animation-delay:1.95s"/><rect class="pline" x="438" y="256" width="25.2" height="4" rx="2" fill="#8B949E" style="animation-delay:2.20s"/><text x="504" y="216" class="m4" font-size="15" fill="#8B949E">tailored</text><text x="504" y="240" class="m7" font-size="16" fill="#E6EDF3" letter-spacing="1">RÉSUMÉ</text><text x="504" y="264" class="m4" font-size="15" fill="#8B949E">LaTeX→PDF</text></svg>
