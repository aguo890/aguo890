<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t d"><title id="t">Fabrik</title><desc id="d">Fabrik (private, in production): ERP/MES for two apparel manufacturers, co-built with one other engineer; 100 pages and 5,300+ tests.</desc><style>@font-face{font-family:"ag-i4";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}.i4{font-family:"ag-i4",Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:400}@font-face{font-family:"ag-i6";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}.i6{font-family:"ag-i6",Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:600}@font-face{font-family:"ag-m4";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}.m4{font-family:"ag-m4",'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}@font-face{font-family:"ag-m7";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}.m7{font-family:"ag-m7",'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:.2}}.flow{stroke-dasharray:5 7;animation:flow .9s linear infinite}@keyframes flow{to{stroke-dashoffset:-12}}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 8s cubic-bezier(.3,0,.2,1) infinite backwards}@keyframes grow{0%{transform:scaleY(.04)}10%,90%{transform:scaleY(1)}100%{transform:scaleY(.04)}}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><rect x="1" y="1" width="598" height="338" rx="6" fill="#1F2328" fill-opacity="0.036" stroke="#59636E" stroke-opacity="0.28"/><path d="M1 13V1H13 M587 1H599V13 M599 327V339H587 M13 339H1V327" fill="none" stroke="#59636E" stroke-width="1.6" stroke-opacity=".7"/><rect x="24" y="1